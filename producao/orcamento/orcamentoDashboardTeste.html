<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />

    <title>Orçamento - Teste</title>

    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="../../templates/favicon.png"/>

    <!-- Bootstrap -->
    <link href="../../vendors/bootstrap/bootstrap.min.css"
          rel="stylesheet" type="text/css">

    <!-- Fontawesome -->
    <link href="../../vendors/fonts/all.min.css"
          rel="stylesheet" type="text/css">

    <!-- DataTables -->
    <link href="../../vendors/datatables/datatables.min.css"
          rel="stylesheet" type="text/css">

    <!-- GLOBAL -->
    <link href="../../global/css/styles.css"
          rel="stylesheet" type="text/css">

    <!-- CSS DOS CARTÕES (caso não esteja incluído em styles.css) -->
    
    <link href="../../global/css/kpi.css"
          rel="stylesheet" type="text/css">
    

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand navbar-dark bg-dark shadow-sm">

        <a class="navbar-brand" href="../../index.html">
            Orçamento
        </a>

        <span class="badge badge-warning">
            VERSÃO DE TESTE
        </span>

        <div class="ml-auto d-flex align-items-center">

            <a class="btn btn-outline-light btn-sm mr-3"
               href="../../index.html">
                <i class="fa fa-home"></i>
            </a>

            <span class="text-white-50 small">
                Paulo Sousa © 2024
            </span>

        </div>

    </nav>


    <!-- CONTEÚDO -->
    <div id="layoutSidenav_content">

        <h1 class="mt-2"></h1>

        <div class="container-fluid">

            <div class="row mb-4">

                <div class="col-12">

                    <!-- CARTÕES -->
                    <div class="card">

                        <div class="card-header">

                            <div class="d-flex align-items-center flex-wrap">

                                <!-- ESCOLHA DO ANO -->
                                <div class="btn btn-info text-white text-left mr-2">

                                    <form
                                        onsubmit="mudaAno(); return false;"
                                        class="d-flex align-items-center mb-0">

                                        <label
                                            class="mb-0 mr-2"
                                            for="anoCorrente">

                                            Orçamento do Ano:

                                            <input
                                                id="anoCorrente"
                                                class="ml-1"
                                                style="text-align: right; width: 80px;"
                                                type="text"
                                                maxlength="4"
                                                inputmode="numeric"
                                                autofocus
                                            >

                                        </label>

                                        <button
                                            type="submit"
                                            class="btn btn-dark btn-sm">

                                            Alterar

                                        </button>

                                    </form>

                                </div>


                                <!-- EXPORTAR EXECUÇÃO ORÇAMENTAL -->
                                <button
                                    type="button"
                                    id="exportarExecucaoPDF"
                                    class="btn btn-danger"
                                    onclick="exportarExecucaoGeralPDF()"
                                    title="Exportar execução orçamental geral para PDF">

                                    <i class="fas fa-file-pdf mr-1"></i>

                                    Execução Orçamental

                                </button>

                            </div>

                        </div>


                        <!-- ======================================================
                            DASHBOARD — EXECUÇÃO ORÇAMENTAL
                        ======================================================= -->

                        <div class="container-fluid">

                            <!-- ==================================================
                                INVESTIMENTOS
                            =================================================== -->

                            <section class="kpi-grupo">

                                <div class="kpi-grupo-titulo">
                                    Investimentos
                                </div>

                                <div class="row" id="cartoesInvestimentos">
                                    <!-- Cartões gerados pelo JavaScript -->
                                </div>

                            </section>


                            <!-- ==================================================
                                GASTOS
                            =================================================== -->

                            <section class="kpi-grupo">

                                <div class="kpi-grupo-titulo">
                                    Gastos
                                </div>

                                <div class="row" id="cartoesGastos">
                                    <!-- Cartões gerados pelo JavaScript -->
                                </div>

                            </section>


                            <!-- ==================================================
                                PROTOCOLOS
                            =================================================== -->

                            <section class="kpi-grupo">

                                <div class="kpi-grupo-titulo">
                                    Protocolos
                                </div>

                                <div class="row" id="cartoesProtocolos">
                                    <!-- Cartões gerados pelo JavaScript -->
                                </div>

                            </section>

                        </div>

                    </div>


                    <!-- DATATABLE -->
                    <div class="card mt-2">

                        <div class="card-body">

                            <div class="row"
                                 id="tabelaExecucaoOrcamento">
                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <h1 class="mt-2"></h1>

        </div>

    </div>


    <!-- ================================================== -->
    <!-- BIBLIOTECAS JAVASCRIPT                             -->
    <!-- ================================================== -->

    <!-- JQuery -->
    <script src="../../vendors/jquery/jquery.js"></script>

    <!-- Global -->
    <script src="../../global/js/scripts.js"></script>

    <!-- Bootstrap -->
    <script src="../../vendors/bootstrap/bootstrap.bundle.min.js"></script>

    <!-- Fontawesome -->
    <script src="../../vendors/fonts/all.min.js"></script>

    <!-- DataTables -->
    <script src="../../vendors/datatables/datatables.min.js"></script>

    <!-- Chart.js -->
    <script src="../../vendors/charts/chart.umd.min.js"></script>

    <!-- jsPDF -->
    <script src="../../vendors/pdf/jspdf.umd.min.js"></script>

    <!-- jsPDF AutoTable -->
    <script src="../../vendors/pdf/jspdf.plugin.autotable.min.js"></script>

    <!-- SheetJS (XLSX) -->
    <script src="../../vendors/pdf/xlsx.full.min.js"></script>


    <!-- ================================================== -->
    <!-- JAVASCRIPT DA PÁGINA - VERSÃO DE TESTE              -->
    <!-- ================================================== -->

    <script src="js/orcamentoDashboardTeste.js"></script>

</body>

</html>
