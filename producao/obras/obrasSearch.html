                        type="text"
                        placeholder="Digite qualquer parte do nome do Processo ..."
                        aria-label="Search1" aria-describedby="basic-addon1"

                        autofocus
                        oninput="procuraNomeProcesso(this.value)">

                        <label>Fornecedor</label>

                        class="form-control"
                        type="text"
                        placeholder="Digite qualquer parte do nome do Fornecedor ..."

                        <label>Processo Administrativo</label>
                        <input
                        class="form-control"
                        type="text"
                        placeholder="Digite qualquer parte do Processo Administrativo ..."
                        aria-label="Search3" aria-describedby="basic-addon2"
                        id="codigoProcessoAdministrativo"
                        oninput="procuraProcessoAdministrativo(this.value)">

                        <h1 class="mt-2"></h1>
                      
                    </form>
