<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<meta name="description" content="" />
<meta name="author" content="" />

<title>Fornecedores</title>
<link
  rel="icon"
  type="image/png"
  sizes="16x16"
  href="../../templates/favicon.png"/>

<!-- CSS -->
<!-- Bootstrap -->
<link href="../../vendors/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">
<!-- Fontawesome -->
<!--<link href="../../vendors/font-awesome/all.min.css" rel="stylesheet" type="text/css">-->
<link href="../../vendors/fonts/all.min.css" rel="stylesheet" type="text/css">
<!-- Datables -->
<link href="../../vendors/datatables/datatables.min.css" rel="stylesheet" type="text/css">
<!-- GLOBAL -->
<link href="../../global/css/styles.css" rel="stylesheet" type="text/css">

<style>
    /* Adiciona uma imagem em 'background' a toda a página */
    body  {
      background-image: url('../../global/imagens/bgPages.jpg');
      background-size: cover;
    }
</style>

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand navbar-dark bg-dark shadow-sm">

        <a class="navbar-brand" href="../../index.html">
            <i class="fa fa-binoculars"></i>
            Vistorias
        </a>

        <div class="ml-auto d-flex align-items-center">

            <a class="btn btn-outline-light btn-sm mr-3" href="../../index.html">
                <i class="fa fa-home"></i>
            </a>

            <span class="text-white-50 small">
                Paulo Sousa © 2024
            </span>

        </div>

    </nav>

    <!-- CONTEÚDO -->
    <div class="container-fluid py-4 vistorias-dasboard">

        <div class="container-fluid">

            <!-- Título -->
            <div class="row mb-3">
                <div class="col">
                    <h3 class="mb-0 text-white">Vistorias
                        <small class="text-white-50 ml-2">| Programadas, vencidas e agendadas</small>
                    </h3>
                </div>
            </div>
        
            <!-- Pesquisa -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="input-group shadow-sm">
                        <div class="input-group-prepend">
                            <span class="input-group-text">
                                <i class="fa fa-search"></i>
                            </span>
                        </div>
        
                        <input
                            id="txtPesquisa"
                            type="text"
                            class="form-control"
                            placeholder="Pesquisar por entidade, processo ou designação...">
        
                        <div class="input-group-append">
                            <button
                                class="btn btn-outline-secondary"
                                id="btnLimpar">
                                Limpar
                            </button>
                        </div>
                    
                    </div>
                </div>
            </div>
        
            <!-- Cartões -->
            <div class="row align-items-stretch">
                <!-- ===================== RESUMO ===================== -->
        
                <div class="col-lg-3 mb-4 d-flex">
                    <div class="card card-dashboard shadow-sm border-info h-100 w-100">

                        <div class="card-header bg-info text-white">
                            <strong><i class="fa fa-chart-pie"></i> Resumo</strong>
                        </div>
        
                        <div class="card-body">
                            <table class="table table-sm table-borderless mb-0">
                                <tr>
                                    <th>Total</th>
                                    <td class="text-right">
                                        <span id="totalRegistos">0</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th>Vencidas</th>
                                    <td class="text-right text-danger">
                                        <span id="totalVencidasResumo">0</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th>Programadas</th>
                                    <td class="text-right text-success">
                                        <span id="totalProgramadasResumo">0</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th>Agendadas</th>
                                    <td class="text-right text-primary">
                                        <span id="totalAgendadasResumo">0</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th>Valor</th>
                                    <td class="text-right font-weight-bold">
                                        <span id="valorTotal">0 €</span>
                                    </td>
                                </tr>
                            </table>
                        </div>
        
                    </div>
                </div>
        
                <!-- ===================== VENCIDAS ===================== -->
                 <div class="col-lg-3 mb-4 d-flex">
        
                    <div class="card card-dashboard shadow-sm border-danger h-100 w-100">
        
                        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">
        
                            <strong>
        
                                <i class="fa fa-exclamation-circle"></i>
        
                                Vencidas
        
                            </strong>
        
                            <div>
        
                                <button
                                    id="pdfVencidas"
                                    class="btn btn-light btn-sm">
        
                                    <i class="fa fa-file-pdf text-danger"></i>
        
                                </button>
        
                                <button
                                    id="xlsVencidas"
                                    class="btn btn-light btn-sm">
        
                                    <i class="fa fa-file-excel text-success"></i>
        
                                </button>
        
                                <span
                                    id="totalVencidas"
                                    class="badge badge-light">
        
                                    0
        
                                </span>
        
                            </div>
        
                        </div>
        
                        <div class="card-body p-2" style="max-height:70vh;overflow:auto;">
        
                            <div id="vencido"></div>
        
                        </div>
        
                    </div>
        
                </div>
        
                <!-- ===================== PROGRAMADAS ===================== -->
        
                <div class="col-lg-3 mb-4 d-flex">
        
                    <div class="card card-dashboard shadow-sm border-success h-100 w-100">
        
                        <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        
                            <strong>
        
                                <i class="fa fa-calendar"></i>
        
                                Programadas
        
                            </strong>
        
                            <div>
        
                                <button
                                    id="pdfProgramadas"
                                    class="btn btn-light btn-sm">
        
                                    <i class="fa fa-file-pdf text-danger"></i>
        
                                </button>
        
                                <button
                                    id="xlsProgramadas"
                                    class="btn btn-light btn-sm">
        
                                    <i class="fa fa-file-excel text-success"></i>
        
                                </button>
        
                                <span
                                    id="totalProgramadas"
                                    class="badge badge-light">
        
                                    0
        
                                </span>
        
                            </div>
        
                        </div>
        
                        <div class="card-body p-2" style="max-height:70vh;overflow:auto;">
        
                            <div id="programado"></div>
        
                        </div>
        
                    </div>
        
                </div>
        
                <!-- ===================== AGENDADAS ===================== -->
        
                <div class="col-lg-3 mb-4 d-flex">
        
                    <div class="card card-dashboard shadow-sm border-primary h-100 w-100">
        
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        
                            <strong>
        
                                <i class="fa fa-clock"></i>
        
                                Agendadas
        
                            </strong>
        
                            <div>
        
                                <button
                                    id="pdfAgendadas"
                                    class="btn btn-light btn-sm">
        
                                    <i class="fa fa-file-pdf text-danger"></i>
        
                                </button>
        
                                <button
                                    id="xlsAgendadas"
                                    class="btn btn-light btn-sm">
        
                                    <i class="fa fa-file-excel text-success"></i>
        
                                </button>
        
                                <span
                                    id="totalAgendadas"
                                    class="badge badge-light">
        
                                    0
        
                                </span>
        
                            </div>
        
                        </div>
        
                        <div class="card-body p-2" style="max-height:70vh;overflow:auto;">
        
                            <div id="agendado"></div>
        
                        </div>
        
                    </div>
        
                </div>
        
            </div>
        
            <div
                id="lstErros"
                class="alert alert-danger"
                style="display:none">
            </div>
        
        </div>


    <!-- JQuery - Deve Ser incluido antes do Global -->
    <script src="../../vendors/jquery/jquery.js"></script>
    <!-- Global -->
    <script src="../../global/js/scripts.js"></script>
    
    <!-- Bootstrap -->
    <script src="../../vendors/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- Fontawesome -->
    <!--<script src="../../vendors/font-awesome/all.min.js"></script>-->
    <script src="../../vendors/fonts/all.min.js"></script>
    <!-- Bootstrap -->
    <script src="../../vendors/datatables/datatables.min.js"></script>
    <!-- Charts -->
    <script src="../../vendors/charts/chart.umd.min.js"></script>
    <!-- jsPDF autoTable -->
    <script src="../../vendors/pdf/jspdf.umd.min.js"></script>
    <script src="../../vendors/pdf/jspdf.plugin.autotable.min.js"></script>
    <!-- SheetJS (XLSX) -->
    <script src="../../vendors/pdf/xlsx.full.min.js"></script>

<!-- JS de Página -->
    <!--script src="js/main.js"></script-->
    <script src="js/vistorias.js"></script>
    
</body>
</html>
